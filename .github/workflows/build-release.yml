name: Build and Release APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag da release, por exemplo v0.1.0'
        required: true
        default: 'v0.1.0'
      prerelease:
        description: 'Marcar como pre-release'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout com submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Validar Android SDK do runner
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Instalar SDK, NDK e CMake
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Permitir Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Compilar variante release
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Verificar APKs gerados
        run: |
          find app/build/outputs/apk -type f -name '*.apk' -print
          test -n "$(find app/build/outputs/apk -type f -name '*.apk' -print -quit)"

      - name: Gerar checksums
        run: |
          mkdir -p release-assets
          find app/build/outputs/apk -type f -name '*.apk' -exec cp {} release-assets/ \;
          sha256sum release-assets/*.apk | tee release-assets/SHA256SUMS.txt

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: WinJalBionic Cmod ${{ inputs.release_tag }}
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease }}
          files: release-assets/*
